{% extends "base_generic.html" %}

{% block title %}{% if form.instance.pk %}Editar Pedido{% else %}Nuevo Pedido{% endif %}{% endblock %}

{% block content %}
<h2>{% if form.instance.pk %}Editar Pedido{% else %}Nuevo Pedido{% endif %}</h2>
<form method="post">
    {% csrf_token %}
    <div class="form-group">
        {{ form.as_p }}
    </div>
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{% url 'pedidos:pedido-list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
