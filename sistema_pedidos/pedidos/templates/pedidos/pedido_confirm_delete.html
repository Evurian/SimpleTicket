{% extends "base_generic.html" %}

{% block title %}Confirmar eliminación del Pedido{% endblock %}

{% block content %}
<h2>Confirmar eliminación del Pedido</h2>
<p>¿Está seguro de que desea eliminar el pedido de {{ object.cliente }}?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Eliminar</button>
    <a href="{% url 'pedidos:pedido-detail' object.pk %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
