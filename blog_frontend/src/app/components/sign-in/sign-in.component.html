<section id="signInSection1" class="min-h-screen flex items-center justify-center bg-[#F9FAFB] dark:bg-[#0B0F19] py-16 px-4 font-['Plus_Jakarta_Sans','Google_Sans',sans-serif]">
    <!-- Back button inside the section to prevent overlapping issues -->
    <a routerLink="/home" id="signInSection1BackHome" class="absolute top-8 left-8 z-20 flex items-center justify-center w-9 h-9 rounded-sm bg-white dark:bg-slate-900 border border-gray-255 dark:border-slate-800 shadow-sm text-gray-600 dark:text-gray-400 hover:text-[#3B82F6] dark:hover:text-[#3B82F6] hover:bg-gray-50 dark:hover:bg-slate-800 transition-all duration-200">
        <i class="fa-solid fa-arrow-left text-sm"></i>
    </a>

    <div id="signInSection1Container" class="w-full max-w-[420px] bg-white dark:bg-[#111827] border border-gray-250 dark:border-slate-800 p-8 rounded-md shadow-sm transition-colors duration-300">
      
      <div class="mb-8">
        <h1 class="text-[2.5rem] font-light text-[#111827] dark:text-white leading-tight tracking-tight mb-2 font-['Plus_Jakarta_Sans','Google_Sans',sans-serif]">Iniciar Sesión</h1>
        <p class="text-gray-500 dark:text-gray-400 text-sm font-light">Introduce tus datos de acceso a continuación.</p>
      </div>

      <form [formGroup]="signInForm" (ngSubmit)="signIn()" class="space-y-6">
        <div>
          <label for="username" class="block font-['Anonymous_Pro',monospace] text-[0.875rem] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">USUARIO</label>
          <input formControlName="username" type="text" id="username" placeholder="nombre_usuario" required
                 class="w-full px-3 py-2 bg-[#F9FAFB] dark:bg-[#0B0F19] border border-gray-300 dark:border-slate-700 rounded-sm focus:outline-none focus:border-[#3B82F6] focus:ring-1 focus:ring-[#3B82F6]/50 text-[#111827] dark:text-white text-sm transition-all duration-200 placeholder:text-gray-400/70">
        </div>

        <div>
          <label for="password" class="block font-['Anonymous_Pro',monospace] text-[0.875rem] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">CONTRASEÑA</label>
          <input formControlName="password" type="password" id="password" placeholder="••••••••" required
                 class="w-full px-3 py-2 bg-[#F9FAFB] dark:bg-[#0B0F19] border border-gray-300 dark:border-slate-700 rounded-sm focus:outline-none focus:border-[#3B82F6] focus:ring-1 focus:ring-[#3B82F6]/50 text-[#111827] dark:text-white text-sm transition-all duration-200 placeholder:text-gray-400/70">
        </div>

        <button type="submit" [disabled]="signInForm.invalid"
                class="w-full bg-[#3B82F6] hover:bg-[#2563EB] disabled:bg-gray-200 dark:disabled:bg-slate-800 disabled:text-gray-500 dark:disabled:text-gray-600 disabled:cursor-not-allowed text-white font-medium py-2.5 px-4 rounded-sm transition-all duration-200 font-['Plus_Jakarta_Sans','Google_Sans',sans-serif] text-sm tracking-wide">
          Acceder
        </button>
      </form>

      <!-- Divider for Google login -->
      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-200 dark:border-slate-800"></div>
        </div>
        <div class="relative flex justify-center text-xs">
          <span class="bg-white dark:bg-[#111827] px-3 text-gray-500 dark:text-gray-400 font-['Anonymous_Pro',monospace] uppercase tracking-wider">O CONTINUAR CON</span>
        </div>
      </div>

      <!-- Google login button container -->
      <div class="w-full flex justify-center min-h-[44px]">
        <div id="google-btn" class="w-full"></div>
      </div>

      <!-- Messages -->
      <div *ngIf="errorMessage" class="mt-6 p-3 border border-red-200 dark:border-red-900/50 bg-red-50/50 dark:bg-red-950/20 text-[#DC2626] dark:text-red-400 text-sm rounded-sm flex items-center gap-2 font-light">
        <i class="fa-solid fa-circle-exclamation text-xs"></i>
        <span>{{ errorMessage }}</span>
      </div>
      <div *ngIf="successMessage" class="mt-6 p-3 border border-green-200 dark:border-green-900/50 bg-green-50/50 dark:bg-green-950/20 text-[#16A34A] dark:text-green-400 text-sm rounded-sm flex items-center gap-2 font-light">
        <i class="fa-solid fa-circle-check text-xs"></i>
        <span>{{ successMessage }}</span>
      </div>

      <p class="text-center mt-8 text-sm text-gray-600 dark:text-gray-400 font-light">
        ¿No tienes una cuenta? 
        <a href="/sign-up" class="text-[#3B82F6] hover:text-[#2563EB] dark:text-[#3B82F6] dark:hover:text-[#2563EB] font-medium transition duration-200 ml-1">Regístrate</a>
      </p>
    </div>
</section>
