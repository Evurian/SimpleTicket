@if (product; as productInfo) {
    <div class="product-detail">
      <img [src]="productInfo.image" alt="Product Image">
      <div>
        <h1 class = "product-title">{{ productInfo.title }}</h1>
        <p class = "product-description">{{ productInfo.description }}</p>
        <p class = "product-price">Precio: S/ {{ productInfo.price }}</p>
        <p class = "product-category">Categoría: {{ productInfo.category }}</p>
        <button class="order-button" (click)="makeOrder()">Hacer Pedido</button>
      </div>
    </div>
  }
