<div class="productos-container">
    @for(product of productos; track product.id){
        <p-card [header]="product.title" [subheader]="product.category" [style]="{ width: '360px' }">
            <ng-template pTemplate="header">
              <img alt="Card" [src]="product.image" />
            </ng-template>
            <p>
              {{ product.description }}
            </p>
          </p-card>
    }
    </div>
