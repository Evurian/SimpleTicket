<header class="sticky top-0 z-50 w-full border-b border-slate-200/80 bg-white/80 backdrop-blur-md transition-all duration-300 dark:border-slate-800/80 dark:bg-slate-900/80">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
    
    <!-- Logo -->
    <div class="flex items-center gap-2">
      <a routerLink="/home" class="flex items-center gap-2 text-2xl font-bold tracking-tight text-indigo-600 transition hover:opacity-90 dark:text-indigo-400">
        <i class="fa-solid fa-ticket text-3xl"></i>
        <span>SimpleTicket</span>
      </a>
    </div>

    <!-- Navigation -->
    <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-700 dark:text-slate-300">
      <a routerLink="/home" routerLinkActive="text-indigo-600 dark:text-indigo-400" class="transition hover:text-indigo-600 dark:hover:text-indigo-400">Inicio</a>
      <a routerLink="/list" routerLinkActive="text-indigo-600 dark:text-indigo-400" class="transition hover:text-indigo-600 dark:hover:text-indigo-400">Productos</a>
      <a *ngIf="isLoggedIn" routerLink="/profile" routerLinkActive="text-indigo-600 dark:text-indigo-400" class="transition hover:text-indigo-600 dark:hover:text-indigo-400">Mi Perfil</a>
    </nav>

    <!-- Right Side Actions -->
    <div class="flex items-center gap-4">
      
      <!-- Theme Toggle -->
      <button (click)="toggleTheme()" type="button" class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-500 transition hover:bg-slate-50 hover:text-slate-700 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-400 dark:hover:bg-slate-900 dark:hover:text-slate-200">
        <i [class]="isDark ? 'fa-solid fa-sun text-lg text-amber-500' : 'fa-solid fa-moon text-lg text-indigo-500'"></i>
      </button>

      <!-- Cart Button -->
      <a routerLink="/list" class="relative inline-flex h-9 w-9 items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-500 transition hover:bg-slate-50 hover:text-slate-700 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-400 dark:hover:bg-slate-900 dark:hover:text-slate-200">
        <i class="fa-solid fa-cart-shopping text-lg"></i>
        <span *ngIf="cartCount > 0" class="absolute -top-1.5 -right-1.5 flex h-5 w-5 items-center justify-center rounded-full bg-emerald-500 text-[10px] font-bold text-white ring-2 ring-white dark:ring-slate-950 animate-bounce">
          {{ cartCount }}
        </span>
      </a>

      <!-- Authentication -->
      <div class="flex items-center gap-2">
        <ng-container *ngIf="isLoggedIn; else guestOptions">
          <button (click)="logout()" class="inline-flex h-9 items-center justify-center rounded-lg bg-red-600 px-4 text-xs font-semibold text-white transition hover:bg-red-500 focus:outline-none focus:ring-2 focus:ring-red-600 focus:ring-offset-2 dark:focus:ring-offset-slate-950">
            Cerrar Sesión
          </button>
        </ng-container>
        <ng-template #guestOptions>
          <a routerLink="/sign-in" class="inline-flex h-9 items-center justify-center rounded-lg border border-slate-200 px-4 text-xs font-semibold text-slate-700 transition hover:bg-slate-50 dark:border-slate-800 dark:text-slate-300 dark:hover:bg-slate-900">
            Entrar
          </a>
          <a routerLink="/sign-up" class="inline-flex h-9 items-center justify-center rounded-lg bg-indigo-600 px-4 text-xs font-semibold text-white transition hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:ring-offset-2 dark:focus:ring-offset-slate-950">
            Registro
          </a>
        </ng-template>
      </div>

    </div>

  </div>
</header>
