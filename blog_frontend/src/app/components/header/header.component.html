<header class="sticky top-0 z-50 w-full border-b border-gray-200 bg-white/95 backdrop-blur-sm transition-all duration-300 dark:border-slate-800 dark:bg-[#111827]/95 font-['Plus_Jakarta_Sans','Google_Sans',sans-serif]">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-6 sm:px-8">
    
    <!-- Logo -->
    <div class="flex items-center gap-2">
      <a routerLink="/home" class="flex items-center gap-2 text-xl font-semibold tracking-tight text-[#3B82F6] transition duration-200 hover:text-[#2563EB]">
        <i class="fa-solid fa-ticket text-xl"></i>
        <span>SimpleTicket</span>
      </a>
    </div>

    <!-- Navigation -->
    <nav class="hidden md:flex items-center gap-6 text-xs font-semibold uppercase tracking-wider font-['Anonymous_Pro',monospace]">
      <a routerLink="/home" routerLinkActive="text-[#3B82F6]" [routerLinkActiveOptions]="{exact: true}" class="transition-colors duration-200 text-gray-500 hover:text-[#3B82F6] dark:text-gray-400 dark:hover:text-[#3B82F6]">Inicio</a>
      <a routerLink="/list" routerLinkActive="text-[#3B82F6]" class="transition-colors duration-200 text-gray-500 hover:text-[#3B82F6] dark:text-gray-400 dark:hover:text-[#3B82F6]">Productos</a>
      <a *ngIf="isLoggedIn" routerLink="/profile" routerLinkActive="text-[#3B82F6]" class="transition-colors duration-200 text-gray-500 hover:text-[#3B82F6] dark:text-gray-400 dark:hover:text-[#3B82F6]">Mi Perfil</a>
      <a *ngIf="isLoggedIn && isAdmin" routerLink="/admin" routerLinkActive="text-[#3B82F6]" class="transition-colors duration-200 text-gray-500 hover:text-[#3B82F6] dark:text-gray-400 dark:hover:text-[#3B82F6]">Administración</a>
    </nav>

    <!-- Right Side Actions -->
    <div class="flex items-center gap-3">
      
      <!-- Theme Toggle -->
      <button (click)="toggleTheme()" type="button" class="inline-flex h-8 w-8 items-center justify-center rounded-sm border border-gray-300 bg-white text-gray-500 transition hover:bg-gray-50 hover:text-gray-700 dark:border-slate-700 dark:bg-[#111827] dark:text-gray-400 dark:hover:bg-slate-800 dark:hover:text-gray-200">
        <i [class]="isDark ? 'fa-solid fa-sun text-sm text-amber-500' : 'fa-solid fa-moon text-sm text-[#3B82F6]'"></i>
      </button>

      <!-- Cart Button -->
      <a routerLink="/list" class="relative inline-flex h-8 w-8 items-center justify-center rounded-sm border border-gray-300 bg-white text-gray-500 transition hover:bg-gray-50 hover:text-gray-700 dark:border-slate-700 dark:bg-[#111827] dark:text-gray-400 dark:hover:bg-slate-800 dark:hover:text-gray-200">
        <i class="fa-solid fa-cart-shopping text-sm"></i>
        <span *ngIf="cartCount > 0" class="absolute -top-1.5 -right-1.5 flex h-4 w-4 items-center justify-center rounded-sm bg-[#16A34A] text-[9px] font-bold text-white ring-1 ring-white dark:ring-slate-950 font-['Anonymous_Pro',monospace]">
          {{ cartCount }}
        </span>
      </a>

      <!-- Authentication -->
      <div class="flex items-center gap-2">
        <ng-container *ngIf="isLoggedIn; else guestOptions">
          <button (click)="logout()" class="inline-flex h-8 items-center justify-center rounded-sm bg-[#DC2626] px-4 text-xs font-medium text-white transition hover:bg-red-700 focus:outline-none">
            Cerrar Sesión
          </button>
        </ng-container>
        <ng-template #guestOptions>
          <a routerLink="/sign-in" class="inline-flex h-8 items-center justify-center rounded-sm border border-gray-300 px-4 text-xs font-medium text-gray-700 transition hover:bg-gray-50 dark:border-slate-700 dark:text-gray-300 dark:hover:bg-slate-800">
            Entrar
          </a>
          <a routerLink="/sign-up" class="inline-flex h-8 items-center justify-center rounded-sm bg-[#3B82F6] px-4 text-xs font-medium text-white transition hover:bg-[#2563EB] focus:outline-none">
            Registro
          </a>
        </ng-template>
      </div>

    </div>

  </div>
</header>
